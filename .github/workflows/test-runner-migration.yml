name: TEST linux build speed (skip tests)

# Throwaway workflow: measure linux build time with/without the test suite on a
# GitHub-hosted ubuntu-latest runner. Three jobs run in parallel:
#   linux_baseline  - current behaviour: TESTS defaults ON, `make` (all targets)
#   linux_notests   - TESTS=OFF, `make` (all non-test targets)
#   linux_solc_only - TESTS=OFF, only the `solc` target
# No secrets, no self-hosted runners.

on:
  push:
    branches:
      - "ci-test/**"
  workflow_dispatch:

jobs:
  linux_baseline:
    runs-on: ubuntu-latest
    env:
      TERM: xterm
      MAKEFLAGS: -j 4
      CMAKE_OPTIONS: -DSOLC_LINK_STATIC=ON
    container:
      # solbuildpackpusher/solidity-buildpack-deps:ubuntu2404-3
      image: solbuildpackpusher/solidity-buildpack-deps@sha256:ef6a91d7f1434c67fb9e05c6136d80f71c0ad9198479e1a88e3437680993cda4
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory '*'
      - name: "Build: TESTS=ON, make all (current)"
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release $CMAKE_OPTIONS -G "Unix Makefiles"
          start=$(date +%s)
          make
          echo "===> baseline (TESTS=ON, all) took $(( $(date +%s) - start )) s"
      - run: ./build/solc/solc --version

  linux_notests:
    runs-on: ubuntu-latest
    env:
      TERM: xterm
      MAKEFLAGS: -j 4
      CMAKE_OPTIONS: -DSOLC_LINK_STATIC=ON -DTESTS=OFF
    container:
      image: solbuildpackpusher/solidity-buildpack-deps@sha256:ef6a91d7f1434c67fb9e05c6136d80f71c0ad9198479e1a88e3437680993cda4
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory '*'
      - name: "Build: TESTS=OFF, make all"
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release $CMAKE_OPTIONS -G "Unix Makefiles"
          start=$(date +%s)
          make
          echo "===> notests (TESTS=OFF, all) took $(( $(date +%s) - start )) s"
      - run: ./build/solc/solc --version

  linux_solc_only:
    runs-on: ubuntu-latest
    env:
      TERM: xterm
      MAKEFLAGS: -j 4
      CMAKE_OPTIONS: -DSOLC_LINK_STATIC=ON -DTESTS=OFF
    container:
      image: solbuildpackpusher/solidity-buildpack-deps@sha256:ef6a91d7f1434c67fb9e05c6136d80f71c0ad9198479e1a88e3437680993cda4
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory '*'
      - name: "Build: TESTS=OFF, target solc only"
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release $CMAKE_OPTIONS -G "Unix Makefiles"
          start=$(date +%s)
          make solc
          echo "===> solc-only (TESTS=OFF, target solc) took $(( $(date +%s) - start )) s"
      - run: ./build/solc/solc --version
