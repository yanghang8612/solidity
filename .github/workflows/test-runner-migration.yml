name: TEST linux build speed (skip tests)

# Throwaway workflow: verify that skipping test compilation does NOT change the
# produced solc binary. Three jobs build the SAME commit three ways, hash the
# resulting build/solc/solc, and upload it as an artifact for byte comparison.
#   linux_baseline  - TESTS=ON,  make        (current behaviour)
#   linux_notests   - TESTS=OFF, make        (skip test/ subdir)
#   linux_solc_only - TESTS=OFF, make solc   (only the solc target)

on:
  push:
    branches:
      - "ci-test/**"
  workflow_dispatch:

jobs:
  linux_baseline:
    runs-on: ubuntu-latest
    env:
      TERM: xterm
      MAKEFLAGS: -j 4
      CMAKE_OPTIONS: -DSOLC_LINK_STATIC=ON
    container:
      image: solbuildpackpusher/solidity-buildpack-deps@sha256:ef6a91d7f1434c67fb9e05c6136d80f71c0ad9198479e1a88e3437680993cda4
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory '*'
      - name: "Build: TESTS=ON, make all (current)"
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release $CMAKE_OPTIONS -G "Unix Makefiles"
          start=$(date +%s)
          make
          echo "===> baseline (TESTS=ON, all) took $(( $(date +%s) - start )) s"
      - name: "Hash solc"
        run: |
          ./build/solc/solc --version
          echo "SHA256_baseline: $(sha256sum build/solc/solc | awk '{print $1}')"
          cp build/solc/solc solc-baseline
      - uses: actions/upload-artifact@v4
        with:
          name: solc-baseline
          path: solc-baseline

  linux_notests:
    runs-on: ubuntu-latest
    env:
      TERM: xterm
      MAKEFLAGS: -j 4
      CMAKE_OPTIONS: -DSOLC_LINK_STATIC=ON -DTESTS=OFF
    container:
      image: solbuildpackpusher/solidity-buildpack-deps@sha256:ef6a91d7f1434c67fb9e05c6136d80f71c0ad9198479e1a88e3437680993cda4
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory '*'
      - name: "Build: TESTS=OFF, make all"
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release $CMAKE_OPTIONS -G "Unix Makefiles"
          start=$(date +%s)
          make
          echo "===> notests (TESTS=OFF, all) took $(( $(date +%s) - start )) s"
      - name: "Hash solc"
        run: |
          ./build/solc/solc --version
          echo "SHA256_notests: $(sha256sum build/solc/solc | awk '{print $1}')"
          cp build/solc/solc solc-notests
      - uses: actions/upload-artifact@v4
        with:
          name: solc-notests
          path: solc-notests

  linux_solc_only:
    runs-on: ubuntu-latest
    env:
      TERM: xterm
      MAKEFLAGS: -j 4
      CMAKE_OPTIONS: -DSOLC_LINK_STATIC=ON -DTESTS=OFF
    container:
      image: solbuildpackpusher/solidity-buildpack-deps@sha256:ef6a91d7f1434c67fb9e05c6136d80f71c0ad9198479e1a88e3437680993cda4
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory '*'
      - name: "Build: TESTS=OFF, target solc only"
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release $CMAKE_OPTIONS -G "Unix Makefiles"
          start=$(date +%s)
          make solc
          echo "===> solc-only (TESTS=OFF, target solc) took $(( $(date +%s) - start )) s"
      - name: "Hash solc"
        run: |
          ./build/solc/solc --version
          echo "SHA256_solc_only: $(sha256sum build/solc/solc | awk '{print $1}')"
          cp build/solc/solc solc-solc-only
      - uses: actions/upload-artifact@v4
        with:
          name: solc-solc-only
          path: solc-solc-only
