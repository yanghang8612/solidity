name: Release / prepare draft

# workflow_dispatch only. Never pull_request_target here: this job carries
# `contents: write` and shells out to `gh`/`aws` on a self-hosted runner, so a
# write token reachable from an external pull request would be a ready-made
# privilege-escalation surface. Only someone who can already invoke a manual
# workflow_dispatch (a repo collaborator) may trigger this.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Merge commit on develop to release"
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: macos-latest

    env:
      S3_BUCKET_PROD: ${{ secrets.S3_BUCKET_PROD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Fork-test scaffolding: when set, prepare borrows artifacts from this
      # published release instead of S3 (see scripts/release/fetch.py), and G4
      # is downgraded to a warning since the borrowed binaries belong to another
      # commit. Leave the repo variable unset for a real S3-backed run.
      TRON_RELEASE_ARTIFACT_RELEASE: ${{ vars.TRON_RELEASE_ARTIFACT_RELEASE }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          submodules: recursive

      - name: Fetch develop for ancestry check
        run: git fetch origin develop:refs/remotes/origin/develop

      - name: Install python dependencies
        run: python3 -m pip install --user -r scripts/release/requirements.txt

      - name: Prepare draft release
        env:
          # Routed through env rather than interpolated directly into the run:
          # script, so a crafted `commit` input can't break out of the shell
          # command it is passed to.
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: PYTHONPATH="$PWD/scripts" python3 -m release.cli prepare "$RELEASE_COMMIT"
