name: macOS build
on: [push, pull_request]

jobs:
  build:
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run build script
        shell: bash
        run: |
          WINPATH=$(cygpath -w "$(pwd)/.circleci/build_win.ps1")
          powershell.exe -ExecutionPolicy Bypass -File "$WINPATH"