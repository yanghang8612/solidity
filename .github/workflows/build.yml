name: Build binaries on multi platform
on:
  push:
    branches:
      - develop

jobs:
  b_windows:
    runs-on: [ self-hosted, Windows ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: .\deps
          key: dependencies-win-${{ runner.arch }}-${{ hashFiles('scripts/install_deps.ps1') }}
          restore-keys: dependencies-win-${{ runner.arch }}-

      - name: Installing dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: powershell
        run: .\scripts\install_deps.ps1

      - name: Run build script
        shell: bash
        run: powershell.exe .github/workflows/build_win.ps1

      - name: Rename binary
        run: mv build\solc\Release\solc.exe build\solc\Release\solc-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: build\solc\Release\solc-windows.exe
          compression-level: 0
          overwrite: true

  b_macos:
    runs-on: [ self-hosted, macOS ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run build script
        run: .github/workflows/build.sh

      - name: Rename binary
        run: mv build/solc/solc build/solc/solc-macos

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: build/solc/solc-macos
          compression-level: 0
          overwrite: true

  b_linux:
    runs-on: [ self-hosted, Linux, for-linux ]

    env:
      CMAKE_OPTIONS: -DCMAKE_BUILD_TYPE=Release -DUSE_Z3_DLOPEN=ON -DUSE_CVC4=OFF -DSOLC_STATIC_STDLIBS=ON
      MAKEFLAGS: -j 10
      CPUs: 10

    container:
      image: solbuildpackpusher/solidity-buildpack-deps@sha256:84a1fb8771236e8d9aa5c615a425b8929e56a6e4f150a60078c8d74a1ceaa6c2

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Fix git safe directory
        run: git config --global --add safe.directory '*'

      - name: Run build script
        run: .github/workflows/build.sh

      - name: Rename binary
        run: mv build/solc/solc build/solc/solc-static-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: build/solc/solc-static-linux
          compression-level: 0
          overwrite: true

  b_ems:
    runs-on: [ self-hosted, Linux, for-ems ]

    env:
      MAKEFLAGS: -j 10
      CPUs: 5

    container:
      image: solbuildpackpusher/solidity-buildpack-deps@sha256:c57f2bfb8c15d70fe290629358dd1c73dc126e3760f443b54764797556b887d4

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Fix git safe directory
        run: git config --global --add safe.directory '*'

      - name: Run build script
        run: .github/workflows/build_ems.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: upload/soljson.js
          compression-level: 0
          overwrite: true

  upload-to-s3:
    needs: [ b_windows, b_macos, b_linux, b_ems ]
    runs-on: [ self-hosted, Linux ]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create solidity tarball for github release
        run: |
          cd artifact
          tar --create --file ../github-binaries.tar *

      - name: Rename binaries to solc-bin naming convention
        run: |
          full_version=$(
            artifact/solc-static-linux --version |
            sed -En 's/^Version: ([0-9.]+.*\+commit\.[0-9a-f]+(\.mod)?).*$/\1/p'
          )

          mkdir -p solc-bin/{linux-amd64,macosx-amd64,windows-amd64,bin}

          mv artifact/solc-static-linux "solc-bin/linux-amd64/solc-linux-amd64-v${full_version}"
          mv artifact/solc-macos        "solc-bin/macosx-amd64/solc-macosx-amd64-v${full_version}"
          mv artifact/solc-windows.exe  "solc-bin/windows-amd64/solc-windows-amd64-v${full_version}.exe"
          mv artifact/soljson.js        "solc-bin/bin/soljson-v${full_version}.js"

          cd solc-bin/
          tar --create --file ../solc-bin-binaries.tar *

      - name: Upload to S3
        run: |
          aws s3 cp github-binaries.tar s3://solidity/${{ github.sha }}/
          aws s3 cp solc-bin-binaries.tar s3://solidity/${{ github.sha }}/
