name: macOS build
on: [push, pull_request]

jobs:
  b_windows:
    runs-on: [ self-hosted, Windows ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deps
        run: powershell.exe scripts/install_deps.ps1

      - name: Run build script
        shell: bash
        run: powershell.exe .github/workflows/build_on_win.ps1

  b_macos:
    runs-on: [ self-hosted, macOS ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run build script
        run: scripts/ci/build.sh

  b_ubuntu:
    runs-on: [ self-hosted, Linux ]

    container:
      image: solbuildpackpusher/solidity-buildpack-deps@sha256:84a1fb8771236e8d9aa5c615a425b8929e56a6e4f150a60078c8d74a1ceaa6c2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix git safe directory
        run: git config --global --add safe.directory '*'

      - name: Run build script
        run: scripts/ci/build.sh
